# Databricks Asset Bundle definition.
# `databricks bundle deploy` syncs this project (notebooks + src) into the
# workspace and creates/updates the job defined under resources/.
bundle:
  name: transaction-etl

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all pipeline tables
    default: workspace
  schema:
    description: Schema (database) for all pipeline tables
    default: transactions
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries
    default: c14557ce85c326fd  # Serverless Starter Warehouse

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-05f93f23-883e.cloud.databricks.com
